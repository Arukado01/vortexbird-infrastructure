name: Validate infrastructure
on:
  push: { branches: [main, develop] }
  pull_request:
permissions: { contents: read }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.13.3 }
      - name: Format HCL
        run: terraform -chdir=terraform fmt -recursive
      - name: Initialize provider schemas only
        run: terraform -chdir=terraform init -backend=false -input=false
      - name: Validate
        run: terraform -chdir=terraform validate
      - name: Scan Terraform and Kubernetes
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,kubernetes
          soft_fail: false
          output_format: cli,sarif
          output_file_path: console,results.sarif
      - name: Security report
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: security-report, path: results.sarif }
