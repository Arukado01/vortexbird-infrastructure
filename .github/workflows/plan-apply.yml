name: EKS alternative - approved Terraform plan and apply
on:
  workflow_dispatch:
    inputs:
      environment: { description: Target environment, type: choice, options: [demo, production], required: true }
      apply: { description: Apply this run's saved plan after protected environment approval, type: boolean, default: false }
permissions: { contents: read, actions: read, id-token: write }
concurrency: { group: 'terraform-${{ inputs.environment }}', cancel-in-progress: false }
env:
  AWS_REGION: us-east-2
  TF_VAR_environment: ${{ inputs.environment }}
  TF_VAR_kubernetes_version: ${{ vars.KUBERNETES_VERSION }}
  TF_VAR_admin_role_arn: ${{ vars.EKS_ADMIN_ROLE_ARN }}
  TF_VAR_eks_public_access_cidrs: ${{ vars.EKS_ADMIN_CIDRS_JSON }}
  TF_VAR_redis_auth_token: ${{ secrets.REDIS_AUTH_TOKEN }}
jobs:
  plan:
    runs-on: ubuntu-latest
    environment: terraform-plan
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.sha }}' }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.13.3 }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: us-east-2
      - name: Initialize approved existing state bucket
        run: terraform -chdir=terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=vortexbird/${{ inputs.environment }}/terraform.tfstate" -backend-config="region=us-east-2" -backend-config="use_lockfile=true"
      - name: Save reviewable plan
        run: |
          terraform -chdir=terraform plan -input=false -var-file=environments/${{ inputs.environment }}.tfvars -out=approved.tfplan
          terraform -chdir=terraform show -no-color approved.tfplan > plan.txt
          sha256sum terraform/approved.tfplan terraform/.terraform.lock.hcl > plan.sha256
          git rev-parse HEAD > plan.commit
      - uses: actions/upload-artifact@v4
        with:
          name: approved-plan
          path: |
            terraform/approved.tfplan
            terraform/.terraform.lock.hcl
            plan.txt
            plan.sha256
            plan.commit
          include-hidden-files: true
          retention-days: 1
  apply:
    if: inputs.apply && github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.sha }}' }
      - name: Fail closed unless the environment enforces manual review
        uses: actions/github-script@v7
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        with:
          script: |
            const { assertDeploymentEnvironment } = require('./scripts/assert-deployment-environment.cjs');
            const response = await github.rest.repos.getEnvironment({
              ...context.repo, environment_name: process.env.TARGET_ENVIRONMENT
            });
            assertDeploymentEnvironment(response.data, process.env.TARGET_ENVIRONMENT);
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.13.3 }
      - uses: actions/download-artifact@v4
        with: { name: approved-plan, path: . }
      - name: Verify exact plan, provider lock and reviewed commit
        run: |
          sha256sum --check plan.sha256
          test "$(cat plan.commit)" = "$(git rev-parse HEAD)"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: us-east-2
      - run: terraform -chdir=terraform init -input=false -lockfile=readonly -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=vortexbird/${{ inputs.environment }}/terraform.tfstate" -backend-config="region=us-east-2" -backend-config="use_lockfile=true"
      - name: Apply the exact approved saved plan
        run: terraform -chdir=terraform apply -input=false approved.tfplan
