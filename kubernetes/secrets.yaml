apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: { name: backend-aws-secrets, namespace: vortexbird }
spec:
  provider: aws
  parameters:
    region: us-east-2
    usePodIdentity: "true"
    preferredAddressType: ipv4
    objects: |
      - objectName: "${APPLICATION_SECRET_ARN}"
        objectType: "secretsmanager"
        jmesPath:
          - path: '"ConnectionStrings__Database"'
            objectAlias: database
          - path: '"ConnectionStrings__Redis"'
            objectAlias: redis
  secretObjects:
    - secretName: backend-secrets
      type: Opaque
      data:
        - { objectName: database, key: ConnectionStrings__Database }
        - { objectName: redis, key: ConnectionStrings__Redis }
