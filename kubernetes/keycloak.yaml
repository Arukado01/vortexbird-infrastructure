apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak
  namespace: vortexbird
  annotations: { eks.amazonaws.com/role-arn: "${KEYCLOAK_ROLE_ARN}" }
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: { name: keycloak-aws-secrets, namespace: vortexbird }
spec:
  provider: aws
  parameters:
    region: us-east-2
    objects: |
      - objectName: "${KEYCLOAK_SECRET_ARN}"
        objectType: "secretsmanager"
        jmesPath:
          - { path: KC_DB_URL, objectAlias: url }
          - { path: KC_DB_USERNAME, objectAlias: username }
          - { path: KC_DB_PASSWORD, objectAlias: password }
  secretObjects:
    - secretName: keycloak-secrets
      type: Opaque
      data:
        - { objectName: url, key: KC_DB_URL }
        - { objectName: username, key: KC_DB_USERNAME }
        - { objectName: password, key: KC_DB_PASSWORD }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: keycloak, namespace: vortexbird }
spec:
  replicas: 2
  selector: { matchLabels: { app: keycloak } }
  template:
    metadata: { labels: { app: keycloak } }
    spec:
      serviceAccountName: keycloak
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.4.0
          args: [start]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          envFrom: [{ secretRef: { name: keycloak-secrets } }]
          env:
            - { name: KC_DB, value: postgres }
            - { name: KC_HOSTNAME, value: "https://${AUTH_HOST}" }
            - { name: KC_HTTP_ENABLED, value: "true" }
            - { name: KC_PROXY_HEADERS, value: xforwarded }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_METRICS_ENABLED, value: "true" }
          ports: [{ name: http, containerPort: 8080 }, { name: management, containerPort: 9000 }, { name: cluster, containerPort: 7800 }]
          resources: { requests: { cpu: 500m, memory: 768Mi }, limits: { cpu: "2", memory: 1536Mi } }
          startupProbe: { httpGet: { path: /health/started, port: management }, periodSeconds: 5, failureThreshold: 60 }
          readinessProbe: { httpGet: { path: /health/ready, port: management }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: management }, periodSeconds: 15 }
          volumeMounts: [{ name: secrets-store, mountPath: /mnt/secrets-store, readOnly: true }]
      volumes:
        - name: secrets-store
          csi: { driver: secrets-store.csi.k8s.io, readOnly: true, volumeAttributes: { secretProviderClass: keycloak-aws-secrets } }
---
apiVersion: v1
kind: Service
metadata: { name: keycloak, namespace: vortexbird }
spec: { selector: { app: keycloak }, ports: [{ port: 8080, targetPort: http }] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: keycloak, namespace: vortexbird }
spec: { minAvailable: 1, selector: { matchLabels: { app: keycloak } } }
