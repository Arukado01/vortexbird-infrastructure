apiVersion: v1
kind: Namespace
metadata:
  name: vortexbird
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: vortexbird
# IAM role binding is the Terraform EKS Pod Identity association.
# Do not add an IRSA annotation: the backend uses container credentials.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: deployer, namespace: vortexbird }
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: deployer, namespace: vortexbird }
subjects:
  - kind: Group
    name: vortexbird-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef: { kind: Role, name: deployer, apiGroup: rbac.authorization.k8s.io }
