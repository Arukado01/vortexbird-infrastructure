# Native Windows development only; public endpoints and credentials are never used.
include classpath("application.conf")
node-address { protocol = http, host = "127.0.0.1", port = 9324, context-path = "" }
rest-sqs { enabled = true, bind-port = 9324, bind-hostname = "127.0.0.1", sqs-limits = strict }
rest-stats { enabled = false }
aws { region = "us-east-2", accountId = "000000000000" }
queues {
  vortexbird-events-dlq {
    defaultVisibilityTimeout = 120 seconds
    receiveMessageWait = 20 seconds
  }
  vortexbird-events {
    defaultVisibilityTimeout = 120 seconds
    receiveMessageWait = 20 seconds
    fifo = false
    deadLettersQueue { name = "vortexbird-events-dlq", maxReceiveCount = 5 }
  }
}
