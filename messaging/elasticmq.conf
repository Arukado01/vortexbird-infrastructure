# In-memory local SQS emulator. No external AWS account or credentials.
include classpath("application.conf")

node-address {
  protocol = http
  host = "elasticmq"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

# ElasticMQ 1.x uses camelCase queue options and aws.accountId.
aws {
  region = "us-east-2"
  accountId = "000000000000"
}

queues {
  vortexbird-events-dlq {
    defaultVisibilityTimeout = 120 seconds
    receiveMessageWait = 20 seconds
  }
  vortexbird-events {
    defaultVisibilityTimeout = 120 seconds
    receiveMessageWait = 20 seconds
    fifo = false
    deadLettersQueue {
      name = "vortexbird-events-dlq"
      maxReceiveCount = 5
    }
  }
}
